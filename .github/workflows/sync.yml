name: sync
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python fix_ics.py
        env:
          SOURCE_ICS_URL: ${{ secrets.SOURCE_ICS_URL }}
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - name: keepalive commit if repo idle >45 days
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 3888000 ]; then
            git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
